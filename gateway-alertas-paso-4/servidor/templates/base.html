<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Programa de Alertas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" href="/gateway" aria-label="Prisma Ignis, inicio">
            <img class="brand-logo" src="{{ url_for('static', path='/logo.png') }}" alt="">
            <span>
                <strong>PRISMA IGNIS</strong>
                <small>Prototipo institucional</small>
            </span>
        </a>
        {% if operator %}
        <nav aria-label="Navegación principal">
            <a href="/gateway" {% if active_page == 'gateway' %}class="active"{% endif %}>Enviar SMS desde PC</a>
            <a href="/" {% if active_page == 'alert' %}class="active"{% endif %}>Simular</a>
            <a href="/recipients" {% if active_page == 'recipients' %}class="active"{% endif %}>Destinatarios</a>
            <a href="/history" {% if active_page == 'history' %}class="active"{% endif %}>Simulaciones</a>
        </nav>
        <div class="operator-tools">
            <span>{{ operator.display_name }} · {{ operator.username }}</span>
            {% if operator.role == 'admin' %}
            <a href="/settings" {% if active_page == 'settings' %}class="active"{% endif %}>Configuración</a>
            <a href="/accounts" {% if active_page == 'accounts' %}class="active"{% endif %}>Cuentas</a>
            {% endif %}
            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{ operator.csrf_token }}">
                <button type="submit" class="button-secondary">Cerrar sesión</button>
            </form>
        </div>
        {% endif %}
        <span class="mode-badge">MODO PRUEBA</span>
    </div>
</header>

<main class="page-shell{% if active_page == 'gateway' %} gateway-shell{% endif %}">
    {% block content %}{% endblock %}
</main>
</body>
</html>
